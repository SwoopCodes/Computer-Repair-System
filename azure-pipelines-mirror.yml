# azure-pipelines-mirror.yml
trigger: none

schedules:
- cron: "*/10 * * * *"  # Every 10 minutes. Adjust as needed.
  displayName: 'Sync from GitHub'
  branches:
    include:
    - main
  always: true

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: none

- script: |
    # 1. Clone GitHub repo as a bare repository (fetches all branches and tags)
    git clone --bare https://$GITHUB_PAT@github.com/SwoopCodes/Computer-Repair-System.git mirror-repo
    cd mirror-repo

    # 2. Add the Azure DevOps remote
    git remote add azure https://$AZURE_PAT@dev.azure.com/Computer-Repair-System-PRJ/_git/Computer-Repair-System

    # 3. Push all branches and tags WITHOUT force
    git push azure --all
    git push azure --tags
  displayName: 'Sync GitHub to Azure Repos (no force push)'
  env:
    GITHUB_PAT: $(GitHubPAT)
    AZURE_PAT: $(AzureDevOpsPAT)
