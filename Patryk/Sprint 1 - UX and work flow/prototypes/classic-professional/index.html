<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard — Computer Repair System</title>

</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="topbar">

  <nav aria-label="Main">

    <h2>Recent Tickets</h2>
    <ul class="recent-list" id="recent-tickets"></ul>
